name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run DVC pipeline (if data available)
      run: |
        dvc pull || echo "Data not available, skipping pull"
        dvc repro || echo "Pipeline failed, check data"

    - name: Build Docker image
      run: docker build -t content-moderation-api .

    - name: Test API startup
      run: |
        docker run -d --name api-container -p 8000:8000 content-moderation-api
        sleep 10
        curl -f http://localhost:8000/ || (docker logs api-container && exit 1)
        docker stop api-container

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v5
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image to GHCR
      run: |
        IMAGE=ghcr.io/${{ github.repository_owner }}/content-moderation-api:${{ github.sha }}
        docker build -t $IMAGE .
        docker push $IMAGE
        docker tag $IMAGE ghcr.io/${{ github.repository_owner }}/content-moderation-api:latest
        docker push ghcr.io/${{ github.repository_owner }}/content-moderation-api:latest

    - name: Deploy to remote server (optional)
      if: secrets.SSH_PRIVATE_KEY != '' && secrets.REMOTE_HOST != '' && secrets.REMOTE_USER != ''
      uses: appleboy/ssh-action@v0.1.9
      with:
        host: ${{ secrets.REMOTE_HOST }}
        username: ${{ secrets.REMOTE_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.REMOTE_PORT || '22' }}
        script: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/content-moderation-api:latest
          docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
          docker pull $IMAGE
          docker stop content-moderation-api || true
          docker rm content-moderation-api || true
          docker run -d --name content-moderation-api -p 8000:8000 $IMAGE
